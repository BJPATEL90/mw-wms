<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosaic Wellness WMS</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',system-ui,sans-serif;background:linear-gradient(160deg,#0c4a6e 0%,#0d9488 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff}
  .card{background:rgba(255,255,255,.12);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:36px 32px;text-align:center;max-width:360px;width:90%}
  .logo{width:56px;height:56px;background:#0d9488;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
  .logo svg{width:30px;height:30px;stroke:#fff;stroke-width:2;fill:none}
  h1{font-size:22px;font-weight:700;margin-bottom:6px}
  p{font-size:14px;opacity:.8;margin-bottom:24px;line-height:1.5}
  .loader{width:36px;height:36px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .msg{font-size:13px;opacity:.7}
  .btn{display:inline-block;margin-top:20px;padding:11px 24px;background:#fff;color:#0d9488;border-radius:10px;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;border:none}
  .links{margin-top:20px;font-size:12px;opacity:.6}
  .links a{color:#fff;text-decoration:underline;margin:0 6px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  </div>
  <h1>Mosaic Wellness WMS</h1>
  <p>Warehouse Management System<br>Bhiwandi Facility</p>
  <div class="loader" id="loader"></div>
  <div class="msg" id="msg">Opening WMS…</div>
  <a class="btn" id="manualBtn" style="display:none" href="wms.html">Open WMS Now</a>
  <div class="links">
    <a href="mobile.html">📱 Mobile Floor App</a>
  </div>
</div>
<script>
  // GitHub Pages mode — WMS HTML is served directly from GitHub
  window.location.replace('wms.html');
  setTimeout(function(){
    document.getElementById('loader').style.display='none';
    document.getElementById('msg').innerText='Click below if not redirected automatically.';
    document.getElementById('manualBtn').style.display='inline-block';
  }, 2000);
</script>
</body>
</html>
